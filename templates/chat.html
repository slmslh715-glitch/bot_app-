<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot Setup & Chat</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2, h3 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn:hover { background: #1eb857; }
    .btn:disabled, .chat-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .chat-box { border: 1px solid #e0e0e0; height: 250px; overflow-y: auto; padding: 10px; background: #fafafa; border-radius: 4px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; }
    .msg.user { background: #dcf8c6; align-self: flex-start; }
    .msg.bot { background: #ffffff; border: 1px solid #ddd; align-self: flex-end; }
    .chat-input-container { display: flex; gap: 8px; }
    .chat-input-container input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .chat-btn { background: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>WhatsApp Bot Setup</h2>

  <div class="form-group">
    <label for="phoneId">Phone Number ID:</label>
    <input type="text" id="phoneId" placeholder="e.g. 106543219876543" autocomplete="off">
  </div>

  <div class="form-group">
    <label for="token">Access Token:</label>
    <input type="password" id="token" placeholder="Paste your permanent access token" autocomplete="off">
  </div>

  <button class="btn" id="saveBtn" onclick="saveConfig()">Save & Activate Bot 🚀</button>

  <hr style="margin: 25px 0; border: none; border-top: 1px solid #eee;">

  <h3>Live Chat Preview</h3>
  <div class="chat-box" id="chat"></div>

  <div class="chat-input-container">
    <input type="text" id="chatInput" dir="auto" placeholder="Type a message..." autocomplete="off">
    <button class="chat-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const sessionId = (function () {
    try {
      let id = localStorage.getItem('chat_session');
      if (!id) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
        localStorage.setItem('chat_session', id);
      }
      return id;
    } catch (e) {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
  })();

  const chat = document.getElementById('chat');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  let sending = false;

  chatInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') sendMessage();
  });

  function addMessage(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.setAttribute('dir', 'auto');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function saveConfig() {
    const phoneId = document.getElementById('phoneId').value.trim();
    const token = document.getElementById('token').value.trim();
    const btn = document.getElementById('saveBtn');

    if (!phoneId || !token) {
      alert('Please fill in both fields!');
      return;
    }

    btn.disabled = true;
    try {
      const response = await fetch('/save-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneId: phoneId, token: token })
      });
      const data = await response.json();
      alert(data.success ? 'Bot activated successfully!' : 'Failed to save configuration.');
    } catch (e) {
      alert('Error connecting to server.');
    } finally {
      btn.disabled = false;
    }
  }

  async function sendMessage() {
    if (sending) return;
    const text = chatInput.value.trim();
    if (!text) return;

    sending = true;
    sendBtn.disabled = true;
    addMessage(text, 'user');
    chatInput.value = '';
    const pending = addMessage('...', 'bot');

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await response.json();
      pending.textContent = data.reply || 'No response from server';
    } catch (error) {
      pending.textContent = 'Error connecting to server.';
    } finally {
      sending = false;
      sendBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
      chatInput.focus();
    }
  }
</script>

</body>
</html>
