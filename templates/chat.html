<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot Setup & Chat</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2, h3 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn:hover { background: #1eb857; }
    .chat-box { border: 1px solid #e0e0e0; height: 250px; overflow-y: auto; padding: 10px; background: #fafafa; border-radius: 4px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-wrap: break-word; }
    .msg.user { background: #dcf8c6; align-self: flex-start; }
    .msg.bot { background: #ffffff; border: 1px solid #ddd; align-self: flex-end; }
    .chat-input-container { display: flex; gap: 8px; }
    .chat-btn { background: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>WhatsApp Bot Setup</h2>
  
  <div class="form-group">
    <label>Phone Number ID:</label>
    <input type="text" id="phoneId" placeholder="e.g. 106543219876543">
  </div>
  
  <div class="form-group">
    <label>Access Token:</label>
    <input type="text" id="token" placeholder="Paste your permanent access token">
  </div>
  
  <button class="btn" onclick="saveConfig()">Save & Activate Bot 🚀</button>

  <hr style="margin: 25px 0; border: none; border-top: 1px solid #eee;">

  <h3>Live Chat Preview</h3>
  <div class="chat-box" id="chat"></div>
  
  <div class="chat-input-container">
    <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button class="chat-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  async function saveConfig() {
    let phoneId = document.getElementById('phoneId').value;
    let token = document.getElementById('token').value;
    
    if(!phoneId || !token) {
      alert('Please fill in both fields!');
      return;
    }

    try {
      let response = await fetch('/save-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneId: phoneId, token: token })
      });
      
      let data = await response.json();
      if(data.success) {
        alert('Bot activated successfully!');
      } else {
        alert('Failed to save configuration.');
      }
    } catch(e) {
      alert('Error connecting to server.');
    }
  }

  async function sendMessage() {
    let inputField = document.getElementById('chatInput');
    let text = inputField.value.trim();
    if(!text) return;
    
    let chat = document.getElementById('chat');
    
    // Append user message
    chat.innerHTML += `<div class="msg user">${text}</div>`;
    inputField.value = '';
    chat.scrollTop = chat.scrollHeight;

    try {
      let response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      let data = await response.json();
      
      // Append bot reply
      chat.innerHTML += `<div class="msg bot">${data.reply || 'No response from server'}</div>`;
      chat.scrollTop = chat.scrollHeight;
    } catch (error) {
      chat.innerHTML += `<div class="msg bot">Error connecting to server.</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  }
</script>

</body>
</html>
